<!doctype html>
<!-- Source of truth for the DMG window background. Icon slots and window size are
     mirrored in scripts/make_dmg.sh; see docs/dmg.md before changing coordinates. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --brand: #0084FF;
    --ink: #2D2D2D;
    --muted: #86868B;
    --window-w: 660px;
    --window-h: 420px;
    --icon-y: 232px;
    --app-x: 170px;
    --drop-x: 490px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: var(--window-w);
    height: var(--window-h);
    overflow: hidden;
  }

  body {
    position: relative;
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(760px 420px at 50% -12%, #FFFFFF 0%, rgba(255, 255, 255, 0) 62%),
      radial-gradient(420px 300px at 50% 58%, rgba(0, 132, 255, 0.10) 0%, rgba(0, 132, 255, 0) 70%),
      linear-gradient(180deg, #FBFBFC 0%, #F1F0F0 100%);
  }

  body::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(45, 45, 45, 0.055) 1px, transparent 1px);
    background-size: 22px 22px;
    -webkit-mask-image: radial-gradient(560px 380px at 50% 46%, transparent 38%, #000 100%);
    opacity: 0.6;
  }

  .header {
    position: absolute;
    top: 44px;
    left: 0;
    right: 0;
    text-align: center;
  }

  .title {
    font-size: 25px;
    font-weight: 600;
    letter-spacing: -0.4px;
    color: var(--ink);
  }

  .subtitle {
    margin-top: 9px;
    font-size: 14px;
    font-weight: 400;
    letter-spacing: -0.1px;
    color: var(--muted);
  }

  .subtitle strong { font-weight: 590; color: #5A5A5F; }

  .arrow {
    position: absolute;
    top: calc(var(--icon-y) - 24px);
    left: calc((var(--app-x) + var(--drop-x)) / 2 - 84px);
    width: 168px;
    height: 48px;
  }

  .footer {
    position: absolute;
    bottom: 34px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11.5px;
    letter-spacing: 0.1px;
    color: #A1A1A6;
  }

  .footer .dot { padding: 0 7px; color: #C9C9CE; }
</style>
</head>
<body>
  <div class="header">
    <div class="title">Install OpenClip</div>
    <div class="subtitle">Drag <strong>OpenClip</strong> onto the <strong>Applications</strong> folder</div>
  </div>

  <svg class="arrow" viewBox="0 0 168 48" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="trail" x1="0" y1="0" x2="168" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#0084FF" stop-opacity="0"/>
        <stop offset="0.45" stop-color="#0084FF" stop-opacity="0.45"/>
        <stop offset="1" stop-color="#0084FF" stop-opacity="1"/>
      </linearGradient>
    </defs>
    <path d="M4 24H140" stroke="url(#trail)" stroke-width="5" stroke-linecap="round"/>
    <path d="M138 12L156 24L138 36" stroke="#0084FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <div class="footer">
    OpenClip lives in your menu bar<span class="dot">•</span>Launch it from Applications after installing
  </div>
</body>
</html>
